map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Replace this marker with a random value before installing the configuration:
# openssl rand -hex 32
map $cookie_codex_remember $codex_auth_realm {
    default "Codex Web";
    "__CODEX_TRUST_TOKEN__" off;
}

map $codex_auth_realm $codex_remember_cookie {
    default "codex_remember=__CODEX_TRUST_TOKEN__; Path=/; Max-Age=2592000; Secure; HttpOnly; SameSite=Lax";
    off     "";
}

server {
    listen 8443 ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/certs/codex-web.crt;
    ssl_certificate_key /etc/nginx/certs/codex-web.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    auth_basic $codex_auth_realm;
    auth_basic_user_file /etc/nginx/auth/codex-web;

    gzip on;
    gzip_static on;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/javascript application/json application/wasm image/svg+xml text/css text/javascript;

    location = /manifest.json {
        auth_basic off;
        root /srv/codex-web/webview;
        expires 1d;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location = /favicon.svg {
        auth_basic off;
        root /srv/codex-web/webview;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /assets/pwa-icon-512.png {
        auth_basic off;
        alias /srv/codex-web/webview/assets/pwa-icon-512.png;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ^~ /assets/ {
        alias /srv/codex-web/webview/assets/;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    location = / {
        root /srv/codex-web/webview;
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
        add_header Set-Cookie $codex_remember_cookie;
    }

    location = /index.html {
        root /srv/codex-web/webview;
        add_header Cache-Control "no-cache" always;
        add_header Set-Cookie $codex_remember_cookie;
    }

    location ^~ /__backend/ {
        proxy_pass http://127.0.0.1:8214;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600;
    }

    location ^~ /@fs/ {
        proxy_pass http://127.0.0.1:8214;
        proxy_set_header Host $host;
    }

    location / {
        root /srv/codex-web/webview;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header Set-Cookie $codex_remember_cookie;
    }
}
